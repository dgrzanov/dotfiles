unbind r
bind r source-file ~/.tmux.conf

set-window-option -g mode-keys vi
set-option -g renumber-windows on
set -g mouse on
set -g default-shell /opt/homebrew/bin/fish

# Copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Keyboard shortcuts
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key C-h resize-pane -L 5
bind-key C-j resize-pane -D 5
bind-key C-k resize-pane -U 5
bind-key C-l resize-pane -R 5

# Open windows and panes in current directory
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

source-file ~/lcars-colorscheme/themes/lcars-classic.tmux.conf

# LCARS panel geometry. Keep these overrides after the generated color theme.
# Interior ends are rounded; the LCARS label and clock flow into the screen edges.
# Rounded caps require a Nerd Font or a Powerline-compatible font.
set -g status-left-length 40
set -g status-right-length 64
set -g status-left '#[fg=#000000,bg=#EB943A,bold] LCARS #[fg=#000000,bg=#FCC19F,nobold] #S #[fg=#FCC19F,bg=#000000]#[default] '
set -g status-right '#[fg=#BAA4E5,bg=#000000]#[fg=#000000,bg=#BAA4E5] #{?client_prefix,PREFIX,READY} #[fg=#000000,bg=#EDB378] #h #[fg=#000000,bg=#EB943A,bold] %H:%M #[default]'
set -g window-status-separator ' '
set -g window-status-format '#[fg=#{?window_bell_flag,#F08080,#{?#{||:#{window_activity_flag},#{window_silence_flag}},#C082A9,#101016}},bg=#000000]#[default] #I #W#F #[fg=#{?window_bell_flag,#F08080,#{?#{||:#{window_activity_flag},#{window_silence_flag}},#C082A9,#101016}},bg=#000000]#[default]'
set -g window-status-current-format '#[fg=#{?window_bell_flag,#F08080,#{?#{||:#{window_activity_flag},#{window_silence_flag}},#C082A9,#EB943A}},bg=#000000,nobold]#[default] #I #W#F #[fg=#{?window_bell_flag,#F08080,#{?#{||:#{window_activity_flag},#{window_silence_flag}},#C082A9,#EB943A}},bg=#000000,nobold]#[default]'
